# Copia las estadísticas de Supabase a datos.json (URL directa sin clave):
# https://raw.githubusercontent.com/cimorales/fut7-puntuaciones/main/datos.json
# Se lanza sola cuando Supabase avisa de que han cambiado las estadísticas.
name: Exportar datos.json

on:
  repository_dispatch:
    types: [datos-actualizados]   # aviso de Supabase al cambiar una puntuación
  workflow_dispatch:              # botón "Run workflow" para actualizar a mano
  schedule:
    - cron: '0 5 * * *'           # repaso diario de seguridad (solo guarda si hay cambios)

permissions:
  contents: write

# Si llegan varios avisos seguidos (se editan varias notas), se agrupan en una sola ejecución
concurrency:
  group: exportar-datos
  cancel-in-progress: false

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Esperar a que terminen las ediciones
        if: github.event_name == 'repository_dispatch'
        run: sleep 30

      - name: Descargar estadísticas de Supabase
        run: |
          curl -sSf "https://vwnpmdstzqjdybxvxhvs.supabase.co/rest/v1/jugadores?select=datos&id=eq.1" \
            -H "apikey: sb_publishable_SVMtK51bFQgPMBrWEJQgBg_vsqvQgHb" \
            | jq '.' > datos.json
          # No sobrescribir si la respuesta viene vacía
          test "$(jq '.[0].datos | length' datos.json)" -gt 0

      - name: Guardar solo si ha cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add datos.json
          git diff --cached --quiet || (git commit -m "Actualizar datos.json" && git push)
