<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fut7 Scouting Pro</title>
  <style>
    :root {
      --bg-dark: #080d1a;
      --card-bg: #0f172a;
      --border-color: #1e293b;
      --accent-yellow: #eab308;
      --accent-blue: #38bdf8;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      color: var(--accent-yellow);
      margin: 0 0 5px 0;
      font-size: 2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    header p {
      color: var(--text-muted);
      margin: 0;
    }

    /* Tabs Nav */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .tab-btn.active {
      background: var(--accent-yellow);
      color: #020617;
      border-color: var(--accent-yellow);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: var(--text-light);
    }

    select, textarea, input {
      width: 100%;
      padding: 10px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: white;
      box-sizing: border-box;
      margin-bottom: 15px;
    }

    button.btn-primary {
      width: 100%;
      padding: 12px;
      background: var(--accent-yellow);
      color: #020617;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.btn-primary:hover {
      background: #d97706;
    }

    /* Resultados de Equipos */
    .teams-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    @media (max-width: 768px) {
      .teams-grid {
        grid-template-columns: 1fr;
      }
    }

    .team-box {
      background: #111827;
      border-radius: 10px;
      padding: 15px;
      border-top: 4px solid var(--border-color);
    }

    .team-box.negro { border-top-color: var(--accent-blue); }
    .team-box.amarillo { border-top-color: var(--accent-yellow); }

    .team-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .player-list-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #1f2937;
    }

    .player-pos {
      font-size: 0.8rem;
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--text-muted);
    }

    /* Tabla de Jugadores */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background: #1e293b;
      color: var(--accent-yellow);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Fut7 Scouting Pro</h1>
    <p>Gestión de Plantilla y Generador de Equipos Equilibrados</p>
  </header>

  <!-- Navegación de Pestañas -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('generador')">🚀 Generar Equipos</button>
    <button class="tab-btn" onclick="switchTab('plantilla')">📋 Ver Plantilla / Puntuaciones</button>
  </div>

  <!-- PESTAÑA 1: GENERADOR DE EQUIPOS -->
  <div id="tab-generador" class="tab-content active">
    <div class="card">
      <h2>Convocatoria del Día</h2>
      
      <label for="diaPartido">Día del partido:</label>
      <select id="diaPartido">
        <option value="Lunes">Lunes</option>
        <option value="Miercoles">Miércoles (Priorizar Grupo México)</option>
      </select>

      <label for="listaConvocatoria">Pega la lista de 16 convocados de WhatsApp:</label>
      <textarea id="listaConvocatoria" rows="8" placeholder="1. Reta&#10;2. Agus&#10;3. Ángel&#10;4. Achraf..."></textarea>

      <button class="btn-primary" onclick="generarEquiposWeb()">⚽ Calcular y Repartir Equipos</button>
    </div>

    <div id="resultadoEquipos"></div>
  </div>

  <!-- PESTAÑA 2: VER / EDITAR PLANTILLA -->
  <div id="tab-plantilla" class="tab-content">
    <div class="card">
      <h2>Plantilla Completa de Jugadores</h2>
      <div style="overflow-x: auto;">
        <table id="tablaJugadores">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre / Apodo</th>
              <th>Posición 1</th>
              <th>Posición 2</th>
              <th>Media Global</th>
            </tr>
          </thead>
          <tbody id="bodyJugadores">
            <tr><td colspan="5">Cargando datos de Supabase...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://vwnpmdstzqjdybxvxhvs.supabase.co/rest/v1/jugadores?select=datos&id=eq.1";
  const SUPABASE_KEY = "sb_publishable_SVMtK51bFQgPMBrWEJQgBg_vsqvQgHb";
  let jugadoresData = [];

  // Cargar datos de Supabase al iniciar
  async function cargarDatosSupabase() {
    try {
      const res = await fetch(SUPABASE_URL, {
        headers: { 'apikey': SUPABASE_KEY }
      });
      const data = await res.json();
      if (data && data.length > 0) {
        jugadoresData = data[0].datos;
        renderTablaPlantilla();
      }
    } catch (err) {
      console.error("Error al cargar Supabase:", err);
    }
  }

  function getMediaJugador(p) {
    const jueces = ['Agus', 'Tora', 'Lino', 'Reta', 'Neft'];
    let suma = 0, count = 0;
    jueces.forEach(j => {
      if (p.scores && p.scores[j]) {
        suma += (p.scores[j].r + p.scores[j].v + p.scores[j].t) / 3;
        count++;
      }
    });
    return count > 0 ? (suma / count).toFixed(1) : "6.0";
  }

  function renderTablaPlantilla() {
    const tbody = document.getElementById('bodyJugadores');
    tbody.innerHTML = jugadoresData.map(p => `
      <tr>
        <td>${p.id}</td>
        <td><b>${p.name}</b></td>
        <td><span class="player-pos">${p.pos1}</span></td>
        <td><span class="player-pos">${p.pos2}</span></td>
        <td><b>${getMediaJugador(p)}</b></td>
      </tr>
    `).join('');
  }

  function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
    if (tabName === 'generador') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('tab-generador').classList.add('active');
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('tab-plantilla').classList.add('active');
    }
  }

  function generarEquiposWeb() {
    const texto = document.getElementById('listaConvocatoria').value.toLowerCase();
    const esMiercoles = document.getElementById('diaPartido').value === 'Miercoles';

    if (!texto.trim()) {
      alert("Por favor, pega la lista de convocados.");
      return;
    }

    // Filtrar convocados haciendo coincidir nombres/apodos
    let convocados = jugadoresData.filter(p => {
      let nameClean = p.name.toLowerCase();
      let parts = nameClean.split(' ');
      return parts.some(part => part.length > 2 && texto.includes(part));
    });

    if (convocados.length < 16) {
      alert(`Se han detectado ${convocados.length} jugadores de la lista. Asegúrate de incluir 16 convocados.`);
    }

    // Identificar restricciones fijas
    let charly = convocados.find(p => p.name.toLowerCase().includes('charly')) || convocados[0];
    let zlatan = convocados.find(p => p.name.toLowerCase().includes('zlatan'));
    let achraf = convocados.find(p => p.name.toLowerCase().includes('achraf'));

    let resto = convocados.filter(p => p !== charly);
    resto.sort((a, b) => parseFloat(getMediaJugador(b)) - parseFloat(getMediaJugador(a)));

    let amarillo = [charly];
    let negro = [];

    resto.forEach((p) => {
      if (p === zlatan) {
        if (amarillo.includes(achraf)) negro.push(p);
        else amarillo.push(p);
      } else if (p === achraf) {
        if (amarillo.includes(zlatan)) negro.push(p);
        else negro.push(p);
      } else {
        if (amarillo.length < 8 && (negro.length >= amarillo.length || esMiercoles)) {
          amarillo.push(p);
        } else {
          negro.push(p);
        }
      }
    });

    // Puntos acumulados
    let ptsAmarillo = amarillo.reduce((acc, p) => acc + (parseFloat(getMediaJugador(p)) * 8), 0).toFixed(1);
    let ptsNegro = negro.reduce((acc, p) => acc + (parseFloat(getMediaJugador(p)) * 8), 0).toFixed(1);

    // Formatear salida en pantalla
    let html = `
      <div class="card">
        <h2>Alineación Generada</h2>
        <div class="teams-grid">
          <div class="team-box negro">
            <div class="team-header">
              <h3>EQUIPO NEGRO</h3>
              <span style="color:var(--accent-blue); font-weight:bold;">PUNTOS: ${ptsNegro}</span>
            </div>
            ${negro.map(p => `
              <div class="player-list-item">
                <span><b>${p.name}</b></span>
                <span class="player-pos">${p.pos1}</span>
              </div>
            `).join('')}
          </div>

          <div class="team-box amarillo">
            <div class="team-header">
              <h3 style="color:var(--accent-yellow);">EQUIPO AMARILLO</h3>
              <span style="color:var(--accent-yellow); font-weight:bold;">PUNTOS: ${ptsAmarillo}</span>
            </div>
            ${amarillo.map(p => `
              <div class="player-list-item">
                <span><b>${p.name}</b></span>
                <span class="player-pos">${p.pos1}</span>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `;

    document.getElementById('resultadoEquipos').innerHTML = html;
  }

  // Cargar datos automáticamente al abrir
  window.onload = cargarDatosSupabase;
</script>

</body>
</html>
