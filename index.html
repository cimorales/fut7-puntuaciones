        function App() {
            const [activeTab, setActiveTab] = useState('scouting');
            const [players, setPlayers] = useState(INITIAL_PLAYERS);
            const [search, setSearch] = useState('');
            const [activeJudgeMap, setActiveJudgeMap] = useState({});
            const [sortByRank, setSortByRank] = useState(false);
            const [savingStatus, setSavingStatus] = useState('');

            // Estados del Generador de Equipos
            const [diaPartido, setDiaPartido] = useState('Lunes');
            const [convocatoriaText, setConvocatoriaText] = useState('');
            const [equiposResult, setEquiposResult] = useState(null);

            // Cargar datos guardados previamente desde Supabase al abrir la web
            useEffect(() => {
                async function loadDataFromCloud() {
                    try {
                        const { data, error } = await supabaseClient
                            .from('jugadores')
                            .select('datos')
                            .eq('id', 1)
                            .single();

                        if (data && data.datos) {
                            setPlayers(data.datos);
                        }
                    } catch (e) {
                        console.log("Cargando plantilla inicial por defecto...");
                    }
                }
                loadDataFromCloud();
            }, []);

            // Guardar cambios automáticamente en Supabase
            const saveToCloud = async (newPlayersData) => {
                setSavingStatus('Guardando...');
                try {
                    const { error } = await supabaseClient
                        .from('jugadores')
                        .upsert({ id: 1, datos: newPlayersData });

                    if (!error) {
                        setSavingStatus('¡Guardado!');
                        setTimeout(() => setSavingStatus(''), 2000);
                    } else {
                        setSavingStatus('Error al guardar');
                    }
                } catch (e) {
                    setSavingStatus('Error al guardar');
                }
            };

            const calcJudgeAvg = (s) => (s ? (s.r + s.v + s.t) / 3 : 6);

            const calcGlobalAvg = (scores) => {
                const sum = JUDGES.reduce((acc, j) => acc + calcJudgeAvg(scores[j.id]), 0);
                return sum / JUDGES.length;
            };

            const toggleJudge = (pId, jId) => {
                setActiveJudgeMap(prev => ({
                    ...prev,
                    [pId]: prev[pId] === jId ? null : jId
                }));
            };

            const handleScoreChange = (pId, jId, attr, value) => {
                const val = parseFloat(value) || 0;
                setPlayers(prev => {
                    const updated = prev.map(p => {
                        if (p.id !== pId) return p;
                        return {
                            ...p,
                            scores: {
                                ...p.scores,
                                [jId]: { ...p.scores[jId], [attr]: val }
                            }
                        };
                    });
                    saveToCloud(updated);
                    return updated;
                });
            };

            const handlePosChange = (pId, key, val) => {
                setPlayers(prev => {
                    const updated = prev.map(p => p.id === pId ? { ...p, [key]: val } : p);
                    saveToCloud(updated);
                    return updated;
                });
            };

            const filteredPlayers = useMemo(() => {
                let list = players.filter(p => 
                    p.name.toLowerCase().includes(search.toLowerCase()) ||
                    p.pos1.toLowerCase().includes(search.toLowerCase()) ||
                    p.pos2.toLowerCase().includes(search.toLowerCase())
                );
                if (sortByRank) {
                    list.sort((a, b) => calcGlobalAvg(b.scores) - calcGlobalAvg(a.scores));
                }
                return list;
            }, [players, search, sortByRank]);

            // Función del Generador de Equipos con Restricciones y Búsqueda Inteligente
            const generarEquipos = () => {
                if (!convocatoriaText.trim()) {
                    alert("Por favor, pega la lista de convocados.");
                    return;
                }

                const textoLower = convocatoriaText.toLowerCase();
                
                // Búsqueda inteligente para reconocer nombres, apodos y nombres cortos (Mon, Alex, Luis, etc.)
                let convocados = players.filter(p => {
                    const nameLower = p.name.toLowerCase();
                    const matches = nameLower.match(/\(([^)]+)\)/);
                    const apodo = matches ? matches[1] : "";
                    const primerNombre = nameLower.split(' ')[0];

                    return textoLower.includes(nameLower) || 
                           (apodo && textoLower.includes(apodo)) || 
                           textoLower.includes(primerNombre) ||
                           (nameLower.includes("luis") && textoLower.includes("luis")) ||
                           (nameLower.includes("mon") && textoLower.includes("mon")) ||
                           (nameLower.includes("alex") && textoLower.includes("alex"));
                });

                if (convocados.length < 16) {
                    alert(`Atención: Se han detectado ${convocados.length} jugadores. Comprueba que estén los 16.`);
                }

                // Restricciones fijas
                let charly = convocados.find(p => p.name.toLowerCase().includes('charly')) || convocados[0];
                let zlatan = convocados.find(p => p.name.toLowerCase().includes('zlatan'));
                let achraf = convocados.find(p => p.name.toLowerCase().includes('achraf'));

                const miembrosMexico = ['ramón', 'luis iglesias', 'juanjo', 'nacho', 'miguel', 'piñe'];
                let resto = convocados.filter(p => p !== charly);
                resto.sort((a, b) => calcGlobalAvg(b.scores) - calcGlobalAvg(a.scores));

                let amarillo = [charly];
                let negro = [];

                resto.forEach(p => {
                    const pNameLower = p.name.toLowerCase();
                    
                    if (p === zlatan) {
                        if (amarillo.includes(achraf)) negro.push(p);
                        else amarillo.push(p);
                    } else if (p === achraf) {
                        if (amarillo.includes(zlatan)) negro.push(p);
                        else amarillo.push(p);
                    } else if (diaPartido === 'Miercoles' && miembrosMexico.some(m => pNameLower.includes(m))) {
                        if (amarillo.length < 8) amarillo.push(p);
                        else negro.push(p);
                    } else {
                        const ptsAmarilloActual = amarillo.reduce((acc, current) => acc + calcGlobalAvg(current.scores), 0);
                        const ptsNegroActual = negro.reduce((acc, current) => acc + calcGlobalAvg(current.scores), 0);

                        if (amarillo.length < 8 && (ptsAmarilloActual <= ptsNegroActual || negro.length >= 8)) {
                            amarillo.push(p);
                        } else if (negro.length < 8) {
                            negro.push(p);
                        } else {
                            amarillo.push(p);
                        }
                    }
                });

                const ptsAmarillo = amarillo.reduce((acc, p) => acc + (calcGlobalAvg(p.scores) * 8), 0).toFixed(1);
                const ptsNegro = negro.reduce((acc, p) => acc + (calcGlobalAvg(p.scores) * 8), 0).toFixed(1);

                setEquiposResult({ amarillo, negro, ptsAmarillo, ptsNegro });
            };

            return (

                                </button>

                                >

                                </button>
                            </div>

                        {/* CONTENIDO PESTAÑA 1: SCOUTING */}
                        {activeTab === 'scouting' && (
                            <>

                                        <input 
                                            type="text" 
                                            placeholder="Buscar jugador o posición..."
                                            value={search}
                                            onChange={e => setSearch(e.target.value)}

                                        />
                                    </div>

                                    <div className="flex items-center gap-3 w-full md:w-auto justify-end">
                                        {savingStatus && (
                                            <span className="text-xs px-3 py-1.5 rounded-lg bg-blue-500/10 border border-blue-500/30 text-blue-400 font-bold animate-pulse">
                                                {savingStatus}
                                            </span>
                                        )}
                                        <button 
                                            onClick={() => setSortByRank(!sortByRank)}
                                            className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold border transition-all ${sortByRank ? 'bg-blue-600 border-blue-500 text-white shadow-lg shadow-blue-500/30' : 'bg-slate-900 border-slate-800 text-slate-300 hover:bg-slate-800'}`}
                                        >
                                            <i className="fa-solid fa-sort"></i>
                                            {sortByRank ? 'Ranking Activo' : 'Ordenar por Top'}
                                        </button>
                                    </div>
                                </div>

                                {/* Tabla Principal */}
                                <div className="bg-slate-900/90 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
                                    <div className="grid grid-cols-12 gap-2 p-4 bg-slate-950/80 border-b border-slate-800 text-xs font-bold text-slate-400 uppercase tracking-wider text-center items-center">
                                        <div className="col-span-4 text-left pl-2">Jugador & Demarcaciones</div>
                                        {JUDGES.map(j => (
                                            <div key={j.id} className="col-span-1 flex items-center justify-center gap-1.5">
                                                <span className="w-2 h-2 rounded-full" style={{ backgroundColor: j.accent }}></span>
                                                <span>{j.name}</span>
                                            </div>
                                        ))}
                                        <div className="col-span-3 text-right pr-2">Media Global</div>
                                    </div>

                                    <div className="divide-y divide-slate-800/60">
                                        {filteredPlayers.map(player => {
                                            const activeJudge = activeJudgeMap[player.id];
                                            const globalAvg = calcGlobalAvg(player.scores).toFixed(1);

                                            return (
                                                <div key={player.id} className="hover:bg-slate-800/30 transition-colors">
                                                    <div className="grid grid-cols-12 gap-2 p-4 items-center text-center">
                                                        <div className="col-span-4 text-left pl-2 flex flex-col gap-1.5">
                                                            <span className="font-bold text-slate-100 text-sm tracking-wide">
                                                                {player.name}
                                                            </span>
                                                            <div className="flex gap-2">
                                                                <select 
                                                                    value={player.pos1} 
                                                                    onChange={e => handlePosChange(player.id, 'pos1', e.target.value)}
                                                                    className="bg-slate-800 text-xs font-semibold text-slate-300 px-2 py-0.5 rounded-md border border-slate-700 outline-none cursor-pointer"
                                                                >
                                                                    {POSITIONS.map(p => <option key={p} value={p}>{p}</option>)}
                                                                </select>
                                                                <select 
                                                                    value={player.pos2} 
                                                                    onChange={e => handlePosChange(player.id, 'pos2', e.target.value)}
                                                                    className="bg-slate-800 text-xs font-semibold text-slate-300 px-2 py-0.5 rounded-md border border-slate-700 outline-none cursor-pointer"
                                                                >
                                                                    {POSITIONS.map(p => <option key={p} value={p}>{p}</option>)}
                                                                </select>
                                                            </div>
                                                        </div>

                                                        {JUDGES.map(j => {
                                                            const avg = calcJudgeAvg(player.scores[j.id]).toFixed(1);
                                                            const isActive = activeJudge === j.id;

                                                            return (
                                                                <div key={j.id} className="col-span-1 flex justify-center">
                                                                    <button 
                                                                        onClick={() => toggleJudge(player.id, j.id)}
                                                                        className={`w-11 h-10 rounded-xl font-bold text-sm flex items-center justify-center border transition-all duration-200 ${isActive ? 'scale-110 shadow-lg border-white/50 ring-2 ring-white/20' : 'hover:scale-105 border-slate-800 bg-slate-800/40'}`}
                                                                        style={{ 
                                                                            color: j.accent,
                                                                            backgroundColor: isActive ? `${j.accent}25` : undefined,
                                                                            borderColor: isActive ? j.accent : undefined
                                                                        }}
                                                                    >
                                                                        {avg}
                                                                    </button>
                                                                </div>
                                                            );
                                                        })}

                                                        <div className="col-span-3 text-right pr-2">
                                                            <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-extrabold text-sm shadow-md shadow-blue-500/20">
                                                                <i className="fa-solid fa-fire text-amber-300"></i>
                                                                {globalAvg}
                                                            </span>
                                                        </div>
                                                    </div>

                                                    {/* Desglose Desplegable al hacer clic en el Juez */}
                                                    {activeJudge && (
                                                        <div className="px-6 py-4 bg-slate-950/70 border-t border-slate-800/80">
                                                            <div className="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-xl relative">
                                                                <div className="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
                                                                    <div className="flex items-center gap-2">
                                                                        <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: JUDGES.find(j => j.id === activeJudge)?.accent }}></span>
                                                                        <span className="font-bold text-sm text-slate-200">Evaluación: {activeJudge}</span>
                                                                    </div>
                                                                    <button 
                                                                        onClick={() => toggleJudge(player.id, activeJudge)}
                                                                        className="text-slate-500 hover:text-slate-300"
                                                                    >
                                                                        <i className="fa-solid fa-xmark"></i>
                                                                    </button>
                                                                </div>

                                                                <div className="space-y-3">
                                                                    {[
                                                                        { key: 'r', label: 'Resistencia', icon: 'fa-heart-pulse' },
                                                                        { key: 'v', label: 'Velocidad', icon: 'fa-gauge-high' },
                                                                        { key: 't', label: 'Técnica', icon: 'fa-bullseye' },
                                                                    ].map(attr => {
                                                                        const val = player.scores[activeJudge][attr.key];

                                                                        return (
                                                                            <div key={attr.key} className="flex items-center justify-between text-xs">
                                                                                <div className="flex items-center gap-2 text-slate-400 font-medium w-28">
                                                                                    <i className={`fa-solid ${attr.icon} text-blue-400`}></i>
                                                                                    <span>{attr.label}</span>
                                                                                </div>
                                                                                <div className="flex items-center gap-3 flex-1 px-3">
                                                                                    <input 
                                                                                        type="range" 
                                                                                        min="0" 
                                                                                        max="10" 
                                                                                        step="0.5" 
                                                                                        value={val}
                                                                                        onChange={e => handleScoreChange(player.id, activeJudge, attr.key, e.target.value)}
                                                                                        className="w-full accent-blue-500 bg-slate-800 h-1.5 rounded-lg cursor-pointer"
                                                                                    />
                                                                                </div>
                                                                                <input 
                                                                                    type="number" 
                                                                                    min="0" 
                                                                                    max="10" 
                                                                                    step="0.5" 
                                                                                    value={val}
                                                                                    onChange={e => handleScoreChange(player.id, activeJudge, attr.key, e.target.value)}
                                                                                    className="w-12 text-center bg-slate-800 border border-slate-700 rounded-md py-1 text-slate-100 font-bold outline-none focus:border-blue-500"
                                                                                />
                                                                            </div>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </>
                        )}

                        {/* CONTENIDO PESTAÑA 2: GENERADOR DE EQUIPOS */}
                        {activeTab === 'generador' && (
                            <div className="space-y-6">
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
                                    <h2 className="text-lg font-bold text-amber-400 mb-4 flex items-center gap-2">
                                        <i className="fa-solid fa-list-check"></i>
                                        Convocatoria del Día (16 Jugadores)
                                    </h2>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                                        <div className="col-span-1">
                                            <label className="block text-xs font-bold text-slate-400 mb-2">Día del partido:</label>
                                            <select 
                                                value={diaPartido}
                                                onChange={e => setDiaPartido(e.target.value)}
                                                className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm font-semibold text-slate-200 outline-none focus:border-amber-500"
                                            >
                                                <option value="Lunes">Lunes</option>
                                                <option value="Miercoles">Miércoles (Priorizar Grupo México)</option>
                                            </select>
                                        </div>

                                        <div className="col-span-2">
                                            <label className="block text-xs font-bold text-slate-400 mb-2">Pega la lista de WhatsApp:</label>
                                            <textarea 
                                                rows="5"
                                                value={convocatoriaText}
                                                onChange={e => setConvocatoriaText(e.target.value)}
                                                placeholder="1. Reta&#10;2. Agus&#10;3. Ángel..."
                                                className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 outline-none focus:border-amber-500 font-mono"
                                            ></textarea>
                                        </div>
                                    </div>

                                    <button 
                                        onClick={generarEquipos}
                                        className="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-black rounded-xl shadow-lg shadow-amber-500/20 hover:from-amber-400 hover:to-amber-500 transition-all text-sm uppercase tracking-wider"
                                    >
                                        🚀 Calcular y Repartir Equipos
                                    </button>
                                </div>

                                {/* Resultados de Equipos */}
                                {equiposResult && (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        {/* Equipo Negro */}
                                        <div className="bg-slate-900 border-t-4 border-t-sky-400 border-x border-b border-slate-800 rounded-2xl p-6 shadow-xl">
                                            <div className="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
                                                <h3 className="font-black text-slate-100 tracking-wide text-lg">EQUIPO NEGRO</h3>
                                                <span className="px-3 py-1 bg-sky-500/10 border border-sky-500/30 text-sky-400 font-black rounded-xl text-xs">
                                                    PUNTOS: {equiposResult.ptsNegro}
                                                </span>
                                            </div>
                                            <div className="space-y-2">
                                                {equiposResult.negro.map(p => (
                                                    <div key={p.id} className="flex justify-between items-center p-2.5 bg-slate-950/60 rounded-xl border border-slate-800/80">
                                                        <span className="font-bold text-sm text-slate-200">{p.name}</span>
                                                        <span className="text-xs px-2.5 py-1 bg-slate-800 text-slate-400 font-semibold rounded-lg border border-slate-700">{p.pos1}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Equipo Amarillo */}
                                        <div className="bg-slate-900 border-t-4 border-t-amber-400 border-x border-b border-slate-800 rounded-2xl p-6 shadow-xl">
                                            <div className="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
                                                <h3 className="font-black text-amber-400 tracking-wide text-lg">EQUIPO AMARILLO</h3>
                                                <span className="px-3 py-1 bg-amber-500/10 border border-amber-500/30 text-amber-400 font-black rounded-xl text-xs">
                                                    PUNTOS: {equiposResult.ptsAmarillo}
                                                </span>
                                            </div>
                                            <div className="space-y-2">
                                                {equiposResult.amarillo.map(p => (
                                                    <div key={p.id} className="flex justify-between items-center p-2.5 bg-slate-950/60 rounded-xl border border-slate-800/80">
                                                        <span className="font-bold text-sm text-slate-200">{p.name}</span>
                                                        <span className="text-xs px-2.5 py-1 bg-slate-800 text-slate-400 font-semibold rounded-lg border border-slate-700">{p.pos1}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
