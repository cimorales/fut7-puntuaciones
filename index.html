<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fut7 Scouting Pro</title>
  <style>
    :root {
      --bg-dark: #080d1a;
      --card-bg: #0f172a;
      --border-color: #1e293b;
      --accent-yellow: #eab308;
      --accent-blue: #38bdf8;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      margin: 0;
      padding: 15px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      color: var(--accent-yellow);
      margin: 0 0 5px 0;
      font-size: 2rem;
      text-transform: uppercase;
    }

    /* Navegación de Pestañas */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .tab-btn.active {
      background: var(--accent-yellow);
      color: #020617;
      border-color: var(--accent-yellow);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: var(--text-light);
    }

    select, textarea, input {
      width: 100%;
      padding: 8px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: white;
      box-sizing: border-box;
    }

    .btn-primary {
      padding: 12px 20px;
      background: var(--accent-yellow);
      color: #020617;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
    }

    /* Tabla Principal */
    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      padding: 10px;
      text-align: center;
      border: 1px solid var(--border-color);
    }

    th {
      background: #1e293b;
      color: var(--accent-yellow);
    }

    tr.player-row {
      cursor: pointer;
      transition: background 0.2s;
    }

    tr.player-row:hover {
      background: #1e293b;
    }

    td.player-name {
      text-align: left;
      font-weight: bold;
    }

    /* Modal / Ventana Emergente */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      margin: 0;
      color: var(--accent-yellow);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .judge-block {
      background: #111827;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      border-left: 3px solid var(--accent-blue);
    }

    .judge-block h4 {
      margin: 0 0 8px 0;
      color: var(--accent-blue);
    }

    .attr-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .attr-field label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    /* Contenedor de Equipos Generados */
    .teams-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    @media (max-width: 768px) {
      .teams-grid { grid-template-columns: 1fr; }
    }

    .team-box {
      background: #111827;
      border-radius: 10px;
      padding: 15px;
      border-top: 4px solid var(--border-color);
    }

    .team-box.negro { border-top-color: var(--accent-blue); }
    .team-box.amarillo { border-top-color: var(--accent-yellow); }

    .player-list-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #1f2937;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Fut7 Scouting Pro</h1>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('generador')">🚀 Generar Equipos</button>
    <button class="tab-btn" onclick="switchTab('plantilla')">📋 Scouting & Valoraciones</button>
  </div>

  <!-- PESTAÑA 1: GENERADOR DE EQUIPOS -->
  <div id="tab-generador" class="tab-content active">
    <div class="card">
      <h2>Convocatoria del Día</h2>
      
      <label for="diaPartido">Día del partido:</label>
      <select id="diaPartido" style="margin-bottom:15px;">
        <option value="Lunes">Lunes</option>
        <option value="Miercoles">Miércoles (Priorizar Grupo México)</option>
      </select>

      <label for="listaConvocatoria">Pega la lista de 16 convocados de WhatsApp:</label>
      <textarea id="listaConvocatoria" rows="7" placeholder="1. Reta&#10;2. Agus..."></textarea>

      <button class="btn-primary" style="margin-top:15px;" onclick="generarEquiposWeb()">⚽ Calcular Equipos Equilibrados</button>
    </div>

    <div id="resultadoEquipos"></div>
  </div>

  <!-- PESTAÑA 2: TABLA CON VENTANA EMERGENTE (MODAL) AL HACER CLICK -->
  <div id="tab-plantilla" class="tab-content">
    <div class="card">
      <h2>Plantilla de Jugadores (Haz clic en un jugador para editar)</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Jugador</th>
              <th>Posición 1</th>
              <th>Posición 2</th>
              <th>Media Global</th>
            </tr>
          </thead>
          <tbody id="bodyPlantilla">
            <tr><td colspan="4">Cargando datos de Supabase...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- VENTANA EMERGENTE (MODAL) DE EDICIÓN -->
<div id="modalPlayer" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalPlayerName">Nombre Jugador</h3>
      <button class="close-btn" onclick="cerrarModal()">&times;</button>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:15px;">
      <div>
        <label>Posición 1:</label>
        <select id="modalPos1" onchange="guardarDatosModal()"></select>
      </div>
      <div>
        <label>Posición 2:</label>
        <select id="modalPos2" onchange="guardarDatosModal()"></select>
      </div>
    </div>

    <div id="modalJudgesContainer"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://vwnpmdstzqjdybxvxhvs.supabase.co/rest/v1/jugadores?select=datos&id=eq.1";
  const SUPABASE_UPDATE_URL = "https://vwnpmdstzqjdybxvxhvs.supabase.co/rest/v1/jugadores?id=eq.1";
  const SUPABASE_KEY = "sb_publishable_SVMtK51bFQgPMBrWEJQgBg_vsqvQgHb";
  
  const JUECES = ['Agus', 'Tora', 'Lino', 'Reta', 'Neft'];
  const POSICIONES = ['Portero', 'Defensa', 'Medio', 'Delantero'];
  let jugadoresData = [];
  let currentPlayerIdx = null;

  async function cargarDatosSupabase() {
    try {
      const res = await fetch(SUPABASE_URL, { headers: { 'apikey': SUPABASE_KEY } });
      const data = await res.json();
      if (data && data.length > 0) {
        jugadoresData = data[0].datos;
        renderTablaPlantilla();
      }
    } catch (err) {
      console.error("Error al conectar con Supabase:", err);
    }
  }

  function calcularMediaGlobal(p) {
    let sumaTotal = 0, count = 0;
    JUECES.forEach(j => {
      if (p.scores && p.scores[j]) {
        let r = parseFloat(p.scores[j].r) || 0;
        let v = parseFloat(p.scores[j].v) || 0;
        let t = parseFloat(p.scores[j].t) || 0;
        sumaTotal += (r + v + t) / 3;
        count++;
      }
    });
    return count > 0 ? (sumaTotal / count).toFixed(1) : "6.0";
  }

  function renderTablaPlantilla() {
    const tbody = document.getElementById('bodyPlantilla');
    tbody.innerHTML = jugadoresData.map((p, idx) => `
      <tr class="player-row" onclick="abrirModal(${idx})">
        <td class="player-name">${p.name}</td>
        <td>${p.pos1}</td>
        <td>${p.pos2}</td>
        <td><b>${calcularMediaGlobal(p)}</b></td>
      </tr>
    `).join('');
  }

  function abrirModal(idx) {
    currentPlayerIdx = idx;
    const p = jugadoresData[idx];

    document.getElementById('modalPlayerName').innerText = p.name;
    
    // Selects Posición
    const selPos1 = document.getElementById('modalPos1');
    const selPos2 = document.getElementById('modalPos2');
    selPos1.innerHTML = POSICIONES.map(pos => `<option value="${pos}" ${p.pos1 === pos ? 'selected' : ''}>${pos}</option>`).join('');
    selPos2.innerHTML = POSICIONES.map(pos => `<option value="${pos}" ${p.pos2 === pos ? 'selected' : ''}>${pos}</option>`).join('');

    // Bloques de Jueces
    const judgesDiv = document.getElementById('modalJudgesContainer');
    judgesDiv.innerHTML = JUECES.map(j => {
      let sc = (p.scores && p.scores[j]) ? p.scores[j] : {r:6, v:6, t:6};
      return `
        <div class="judge-block">
          <h4>Juez: ${j}</h4>
          <div class="attr-grid">
            <div class="attr-field">
              <label>Resistencia</label>
              <input type="number" value="${sc.r}" min="1" max="10" onchange="actualizarScoreModal('${j}', 'r', this.value)">
            </div>
            <div class="attr-field">
              <label>Velocidad</label>
              <input type="number" value="${sc.v}" min="1" max="10" onchange="actualizarScoreModal('${j}', 'v', this.value)">
            </div>
            <div class="attr-field">
              <label>Técnica</label>
              <input type="number" value="${sc.t}" min="1" max="10" onchange="actualizarScoreModal('${j}', 't', this.value)">
            </div>
          </div>
        </div>
      `;
    }).join('');

    document.getElementById('modalPlayer').classList.add('open');
  }

  function cerrarModal() {
    document.getElementById('modalPlayer').classList.remove('open');
    renderTablaPlantilla();
    sincronizarSupabaseAuto();
  }

  function actualizarScoreModal(juez, attr, val) {
    let p = jugadoresData[currentPlayerIdx];
    if (!p.scores) p.scores = {};
    if (!p.scores[juez]) p.scores[juez] = {r:6, v:6, t:6};
    p.scores[juez][attr] = parseFloat(val) || 0;
    guardarDatosModal();
  }

  function guardarDatosModal() {
    let p = jugadoresData[currentPlayerIdx];
    p.pos1 = document.getElementById('modalPos1').value;
    p.pos2 = document.getElementById('modalPos2').value;
    sincronizarSupabaseAuto();
  }

  async function sincronizarSupabaseAuto() {
    try {
      await fetch(SUPABASE_UPDATE_URL, {
        method: 'PATCH',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({ datos: jugadoresData })
      });
    } catch (err) {
      console.error("Error al sincronizar con Supabase:", err);
    }
  }

  function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
    if (tabName === 'generador') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('tab-generador').classList.add('active');
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('tab-plantilla').classList.add('active');
    }
  }

  function generarEquiposWeb() {
    const texto = document.getElementById('listaConvocatoria').value.toLowerCase();
    const esMiercoles = document.getElementById('diaPartido').value === 'Miercoles';

    if (!texto.trim()) { alert("Pega la lista de convocados."); return; }

    let convocados = jugadoresData.filter(p => {
      let nameClean = p.name.toLowerCase();
      let parts = nameClean.split(' ');
      return parts.some(part => part.length > 2 && texto.includes(part));
    });

    let charly = convocados.find(p => p.name.toLowerCase().includes('charly')) || convocados[0];
    let zlatan = convocados.find(p => p.name.toLowerCase().includes('zlatan'));
    let achraf = convocados.find(p => p.name.toLowerCase().includes('achraf'));

    let resto = convocados.filter(p => p !== charly);
    resto.sort((a, b) => parseFloat(calcularMediaGlobal(b)) - parseFloat(calcularMediaGlobal(a)));

    let amarillo = [charly];
    let negro = [];

    resto.forEach((p) => {
      if (p === zlatan) {
        if (amarillo.includes(achraf)) negro.push(p);
        else amarillo.push(p);
      } else if (p === achraf) {
        if (amarillo.includes(zlatan)) negro.push(p);
        else negro.push(p);
      } else {
        if (amarillo.length < 8 && (negro.length >= amarillo.length || esMiercoles)) {
          amarillo.push(p);
        } else {
          negro.push(p);
        }
      }
    });

    let ptsAmarillo = amarillo.reduce((acc, p) => acc + (parseFloat(calcularMediaGlobal(p)) * 8), 0).toFixed(1);
    let ptsNegro = negro.reduce((acc, p) => acc + (parseFloat(calcularMediaGlobal(p)) * 8), 0).toFixed(1);

    let html = `
      <div class="card">
        <h2>Alineación Generada</h2>
        <div class="teams-grid">
          <div class="team-box negro">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
              <h3>EQUIPO NEGRO</h3>
              <span style="color:var(--accent-blue); font-weight:bold;">PUNTOS: ${ptsNegro}</span>
            </div>
            ${negro.map(p => `<div class="player-list-item"><span><b>${p.name}</b></span><span>${p.pos1}</span></div>`).join('')}
          </div>

          <div class="team-box amarillo">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
              <h3 style="color:var(--accent-yellow);">EQUIPO AMARILLO</h3>
              <span style="color:var(--accent-yellow); font-weight:bold;">PUNTOS: ${ptsAmarillo}</span>
            </div>
            ${amarillo.map(p => `<div class="player-list-item"><span><b>${p.name}</b></span><span>${p.pos1}</span></div>`).join('')}
          </div>
        </div>
      </div>
    `;

    document.getElementById('resultadoEquipos').innerHTML = html;
  }

  window.onload = cargarDatosSupabase;
</script>

</body>
</html>
