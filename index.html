        function App() {
            const [activeTab, setActiveTab] = useState('scouting');
            const [players, setPlayers] = useState(INITIAL_PLAYERS);
            const [search, setSearch] = useState('');
            const [activeJudgeMap, setActiveJudgeMap] = useState({});
            const [sortByRank, setSortByRank] = useState(false);
            const [savingStatus, setSavingStatus] = useState('');

            const [diaPartido, setDiaPartido] = useState('Lunes');
            const [convocatoriaText, setConvocatoriaText] = useState('');
            const [equiposResult, setEquiposResult] = useState(null);

            useEffect(() => {
                async function loadDataFromCloud() {
                    try {
                        const { data } = await supabaseClient.from('jugadores').select('datos').eq('id', 1).single();
                        if (data && data.datos) setPlayers(data.datos);
                    } catch (e) { console.log("Cargando plantilla inicial..."); }
                }
                loadDataFromCloud();
            }, []);

            const saveToCloud = async (newPlayersData) => {
                setSavingStatus('Guardando...');
                try {
                    const { error } = await supabaseClient.from('jugadores').upsert({ id: 1, datos: newPlayersData });
                    if (!error) {
                        setSavingStatus('¡Guardado!');
                        setTimeout(() => setSavingStatus(''), 2000);
                    } else { setSavingStatus('Error al guardar'); }
                } catch (e) { setSavingStatus('Error al guardar'); }
            };

            const calcJudgeAvg = (s) => (s ? (s.r + s.v + s.t) / 3 : 6);
            const calcGlobalAvg = (scores) => JUDGES.reduce((acc, j) => acc + calcJudgeAvg(scores[j.id]), 0) / JUDGES.length;

            const toggleJudge = (pId, jId) => {
                setActiveJudgeMap(prev => ({ ...prev, [pId]: prev[pId] === jId ? null : jId }));
            };

            const handleScoreChange = (pId, jId, attr, value) => {
                const val = parseFloat(value) || 0;
                setPlayers(prev => {
                    const updated = prev.map(p => {
                        if (p.id !== pId) return p;
                        return { ...p, scores: { ...p.scores, [jId]: { ...p.scores[jId], [attr]: val } } };
                    });
                    saveToCloud(updated);
                    return updated;
                });
            };

            const handlePosChange = (pId, key, val) => {
                setPlayers(prev => {
                    const updated = prev.map(p => p.id === pId ? { ...p, [key]: val } : p);
                    saveToCloud(updated);
                    return updated;
                });
            };

            const filteredPlayers = useMemo(() => {
                let list = players.filter(p => 
                    p.name.toLowerCase().includes(search.toLowerCase()) ||
                    p.pos1.toLowerCase().includes(search.toLowerCase()) ||
                    p.pos2.toLowerCase().includes(search.toLowerCase())
                );
                if (sortByRank) list.sort((a, b) => calcGlobalAvg(b.scores) - calcGlobalAvg(a.scores));
                return list;
            }, [players, search, sortByRank]);

            // Generador con Restricciones
            const generarEquipos = () => {
                if (!convocatoriaText.trim()) { alert("Pega la lista de convocados."); return; }

                const lineas = convocatoriaText.split('\n').map(l => l.trim().toLowerCase()).filter(l => l.length > 0);
                let convocados = [];

                lineas.forEach(linea => {
                    const nombreLimpio = linea.replace(/^\d+[\.\-\)]\s*/, '').trim();
                    let jugadorEncontrado = players.find(p => {
                        const pName = p.name.toLowerCase();
                        const matches = pName.match(/\(([^)]+)\)/);
                        const apodo = matches ? matches[1].toLowerCase() : "";
                        return pName === nombreLimpio || (apodo && apodo === nombreLimpio) || pName.includes(nombreLimpio) || nombreLimpio.split(' ').some(word => word.length > 2 && pName.includes(word));
                    });
                    if (jugadorEncontrado && !convocados.some(j => j.id === jugadorEncontrado.id)) convocados.push(jugadorEncontrado);
                });

                if (convocados.length < 16) { alert(`Atención: Se han detectado ${convocados.length} jugadores.`); }

                let charly = convocados.find(p => p.name.toLowerCase().includes('charly')) || convocados[0];
                let zlatan = convocados.find(p => p.name.toLowerCase().includes('zlatan'));
                let achraf = convocados.find(p => p.name.toLowerCase().includes('achraf'));

                const miembrosMexico = ['ramón', 'luis iglesias', 'juanjo', 'nacho', 'miguel', 'piñe'];
                let resto = convocados.filter(p => p !== charly);
                resto.sort((a, b) => calcGlobalAvg(b.scores) - calcGlobalAvg(a.scores));

                let amarillo = [charly];
                let negro = [];

                resto.forEach(p => {
                    const pNameLower = p.name.toLowerCase();
                    if (p === zlatan) {
                        if (amarillo.includes(achraf)) negro.push(p); else amarillo.push(p);
                    } else if (p === achraf) {
                        if (amarillo.includes(zlatan)) negro.push(p); else amarillo.push(p);
                    } else if (diaPartido === 'Miercoles' && miembrosMexico.some(m => pNameLower.includes(m))) {
                        if (amarillo.length < 8) amarillo.push(p); else negro.push(p);
                    } else {
                        const ptsAmarilloActual = amarillo.reduce((acc, curr) => acc + calcGlobalAvg(curr.scores), 0);
                        const ptsNegroActual = negro.reduce((acc, curr) => acc + calcGlobalAvg(curr.scores), 0);
                        if (amarillo.length < 8 && (ptsAmarilloActual <= ptsNegroActual || negro.length >= 8)) amarillo.push(p);
                        else if (negro.length < 8) negro.push(p);
                        else amarillo.push(p);
                    }
                });

                const ptsAmarillo = amarillo.reduce((acc, p) => acc + (calcGlobalAvg(p.scores) * 8), 0).toFixed(1);
                const ptsNegro = negro.reduce((acc, p) => acc + (calcGlobalAvg(p.scores) * 8), 0).toFixed(1);

                setEquiposResult({ amarillo, negro, ptsAmarillo, ptsNegro });
            };

            return (

                        {/* PESTAÑA 1: SCOUTING */}
                        {activeTab === 'scouting' && (

                                    <div className="flex items-center gap-3 w-full md:w-auto justify-end">
                                        {savingStatus && <span className="text-xs px-3 py-1.5 rounded-lg bg-blue-500/10 text-blue-400 font-bold">{savingStatus}</span>}
                                        <button onClick={() => setSortByRank(!sortByRank)} className={`px-4 py-2 rounded-xl text-xs font-bold border ${sortByRank ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-900 border-slate-800 text-slate-300'}`}>
                                            <i className="fa-solid fa-sort mr-1"></i>{sortByRank ? 'Ranking Activo' : 'Ordenar por Top'}
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-slate-900/90 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
                                    <div className="grid grid-cols-12 gap-2 p-4 bg-slate-950/80 border-b border-slate-800 text-xs font-bold text-slate-400 uppercase text-center items-center">
                                        <div className="col-span-4 text-left pl-2">Jugador & Demarcaciones</div>
                                        {JUDGES.map(j => (
                                            <div key={j.id} className="col-span-1 flex items-center justify-center gap-1.5">
                                                <span className="w-2 h-2 rounded-full" style={{ backgroundColor: j.accent }}></span><span>{j.name}</span>
                                            </div>
                                        ))}
                                        <div className="col-span-3 text-right pr-2">Media Global</div>
                                    </div>

                                    <div className="divide-y divide-slate-800/60">
                                        {filteredPlayers.map(player => {
                                            const activeJudge = activeJudgeMap[player.id];
                                            const globalAvg = calcGlobalAvg(player.scores).toFixed(1);
                                            return (
                                                <div key={player.id} className="hover:bg-slate-800/30 transition-colors">
                                                    <div className="grid grid-cols-12 gap-2 p-4 items-center text-center">
                                                        <div className="col-span-4 text-left pl-2 flex flex-col gap-1.5">
                                                            <span className="font-bold text-slate-100 text-sm">{player.name}</span>
                                                            <div className="flex gap-2">
                                                                <select value={player.pos1} onChange={e => handlePosChange(player.id, 'pos1', e.target.value)} className="bg-slate-800 text-xs text-slate-300 px-2 py-0.5 rounded-md border border-slate-700">
                                                                    {POSITIONS.map(p => <option key={p} value={p}>{p}</option>)}
                                                                </select>
                                                                <select value={player.pos2} onChange={e => handlePosChange(player.id, 'pos2', e.target.value)} className="bg-slate-800 text-xs text-slate-300 px-2 py-0.5 rounded-md border border-slate-700">
                                                                    {POSITIONS.map(p => <option key={p} value={p}>{p}</option>)}
                                                                </select>
                                                            </div>
                                                        </div>

                                                        {JUDGES.map(j => {
                                                            const avg = calcJudgeAvg(player.scores[j.id]).toFixed(1);
                                                            const isActive = activeJudge === j.id;
                                                            return (
                                                                <div key={j.id} className="col-span-1 flex justify-center">
                                                                    <button onClick={() => toggleJudge(player.id, j.id)} className={`w-11 h-10 rounded-xl font-bold text-sm flex items-center justify-center border transition-all ${isActive ? 'scale-110 border-white/50 ring-2 ring-white/20' : 'border-slate-800 bg-slate-800/40'}`} style={{ color: j.accent, backgroundColor: isActive ? `${j.accent}25` : undefined, borderColor: isActive ? j.accent : undefined }}>
                                                                        {avg}
                                                                    </button>
                                                                </div>
                                                            );
                                                        })}

                                                        <div className="col-span-3 text-right pr-2">
                                                            <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-extrabold text-sm shadow-md">
                                                                <i className="fa-solid fa-fire text-amber-300"></i>{globalAvg}
                                                            </span>
                                                        </div>
                                                    </div>

                                                    {activeJudge && (
                                                        <div className="px-6 py-4 bg-slate-950/70 border-t border-slate-800">
                                                            <div className="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-xl">
                                                                <div className="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
                                                                    <span className="font-bold text-sm text-slate-200">Evaluación: {activeJudge}</span>
                                                                    <button onClick={() => toggleJudge(player.id, activeJudge)} className="text-slate-500 hover:text-slate-300"><i className="fa-solid fa-xmark"></i></button>
                                                                </div>
                                                                <div className="space-y-3">
                                                                    {[{ key: 'r', label: 'Resistencia' }, { key: 'v', label: 'Velocidad' }, { key: 't', label: 'Técnica' }].map(attr => (
                                                                        <div key={attr.key} className="flex items-center justify-between text-xs">
                                                                            <span className="text-slate-400 font-medium w-28">{attr.label}</span>
                                                                            <input type="range" min="0" max="10" step="0.5" value={player.scores[activeJudge][attr.key]} onChange={e => handleScoreChange(player.id, activeJudge, attr.key, e.target.value)} className="w-full mx-3 accent-blue-500 bg-slate-800 h-1.5" />
                                                                            <input type="number" min="0" max="10" step="0.5" value={player.scores[activeJudge][attr.key]} onChange={e => handleScoreChange(player.id, activeJudge, attr.key, e.target.value)} className="w-12 text-center bg-slate-800 border border-slate-700 rounded-md py-1 font-bold text-slate-100" />
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </>
                        )}

                        {/* PESTAÑA 2: GENERADOR DE EQUIPOS CON CAMPO DE FÚTBOL DINÁMICO */}
                        {activeTab === 'generador' && (
                            <div className="space-y-6">
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
                                    <h2 className="text-lg font-bold text-amber-400 mb-4 flex items-center gap-2">
                                        <i className="fa-solid fa-list-check"></i>Convocatoria del Día (16 Jugadores)
                                    </h2>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-400 mb-2">Día del partido:</label>
                                            <select value={diaPartido} onChange={e => setDiaPartido(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm font-semibold text-slate-200">
                                                <option value="Lunes">Lunes</option>
                                                <option value="Miercoles">Miércoles (Priorizar Grupo México)</option>
                                            </select>
                                        </div>
                                        <div className="col-span-2">
                                            <label className="block text-xs font-bold text-slate-400 mb-2">Pega la lista de WhatsApp:</label>
                                            <textarea rows="4" value={convocatoriaText} onChange={e => setConvocatoriaText(e.target.value)} placeholder="1. Reta&#10;2. Agus&#10;3. Ángel..." className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 font-mono"></textarea>
                                        </div>
                                    </div>

                                    <button onClick={generarEquipos} className="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-black rounded-xl shadow-lg hover:from-amber-400 hover:to-amber-500 uppercase tracking-wider text-sm">
                                        🚀 Calcular y Generar Alineación en el Campo
                                    </button>
                                </div>

                                {/* RESULTADO: CAMPO DE FÚTBOL TÁCTICO 3D / 2D DINÁMICO */}
                                {equiposResult && (
                                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
                                        {/* Marcador Superior Estilo TV */}
                                        <div className="grid grid-cols-2 md:grid-cols-3 gap-2 mb-6 items-center bg-slate-950 p-4 rounded-xl border border-slate-800">
                                            <div className="bg-slate-900 p-3 rounded-lg border-l-4 border-sky-400 text-center">
                                                <div className="text-xs font-bold text-slate-400">EQUIPO NEGRO</div>
                                                <div className="text-lg font-black text-sky-400">PUNTOS: {equiposResult.ptsNegro}</div>
                                            </div>
                                            <div className="text-center hidden md:block">
                                                <div className="text-xs font-bold text-amber-400 uppercase">{diaPartido} - CAMPO 2 PERALES</div>
                                                <div className="text-xs text-slate-500">FORMACIÓN 1-2-4-1</div>
                                            </div>
                                            <div className="bg-slate-900 p-3 rounded-lg border-l-4 border-amber-400 text-center">
                                                <div className="text-xs font-bold text-slate-400">EQUIPO AMARILLO</div>
                                                <div className="text-lg font-black text-amber-400">PUNTOS: {equiposResult.ptsAmarillo}</div>
                                            </div>
                                        </div>

                                        {/* CAMPO DE FÚTBOL VISUAL CON JUGADORES */}
                                        <div className="football-pitch rounded-2xl p-6 min-h-[550px] flex flex-col justify-between">
                                            <div className="pitch-lines"></div>

                                            {/* EQUIPO NEGRO (IZQUIERDA) */}
                                            <div className="relative z-10">
                                                <div className="text-xs font-black text-sky-300 uppercase mb-2 tracking-widest text-center md:text-left">▶ Ataque Equipo Negro (1-2-4-1)</div>
                                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
                                                    {/* Portero y Defensas */}
                                                    <div className="bg-slate-900/90 border border-sky-400/50 rounded-lg p-2 shadow-lg">
                                                        <div className="text-[10px] text-slate-400 font-bold">PORTERO</div>
                                                        <div className="text-xs font-extrabold text-white truncate">{equiposResult.negro[0]?.name}</div>
                                                    </div>
                                                    <div className="bg-slate-900/90 border border-sky-400/50 rounded-lg p-2 shadow-lg">
                                                        <div className="text-[10px] text-slate-400 font-bold">DEFENSA</div>
                                                        <div className="text-xs font-extrabold text-white truncate">{equiposResult.negro[1]?.name}</div>
                                                    </div>
                                                    <div className="bg-slate-900/90 border border-sky-400/50 rounded-lg p-2 shadow-lg">
                                                        <div className="text-[10px] text-slate-400 font-bold">DEFENSA</div>
                                                        <div className="text-xs font-extrabold text-white truncate">{equiposResult.negro[2]?.name}</div>
                                                    </div>
                                                    <div className="bg-slate-900/90 border border-sky-400/50 rounded-lg p-2 shadow-lg">
                                                        <div className="text-[10px] text-slate-400 font-bold">MEDIO</div>
                                                        <div className="text-xs font-extrabold text-white truncate">{equiposResult.negro[3]?.name}</div>
                                                    </div>
                                                </div>
                                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-center mt-3">
                                                    <div className="bg-slate-900/90 border border-sky-400/50 rounded-lg p-2 shadow-lg">
                                                        <div className="text-[10px] text-slate-400 font-bold">MEDIO</div>
                                                        <div className="text-xs font-extrabold text-white truncate">{equiposResult.negro[4]?.name}</div>
                                                    </div>
                                                    <div className="bg-slate-900/90 border border-sky-400/50 rounded-lg p-2 shadow-lg">
                                                        <div className="text-[10px] text-slate-400 font-bold">MEDIO</div>
                                                        <div className="text-xs font-extrabold text-white truncate">{equiposResult.negro[5]?.name}</div>
                                                    </div>
                                                    <div className="bg-slate-900/90 border border-sky-400/50 rounded-lg p-2 shadow-lg">
                                                        <div className="text-[10px] text-slate-400 font-bold">MEDIO</div>
                                                        <div className="text-xs font-extrabold text-white truncate">{equiposResult.negro[6]?.name}</div>
                                                    </div>
                                                    <div className="bg-slate-900/90 border border-sky-400/50 rounded-lg p-2 shadow-lg bg-sky-950/80">
                                                        <div className="text-[10px] text-sky-300 font-bold">DELANTERO</div>
                                                        <div className="text-xs font-extrabold text-white truncate">{equiposResult.negro[7]?.name}</div>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* LÍNEA DE MEDIO CAMPO DIVISORIA */}
                                            <div className="my-4 border-t-2 border-white/30 relative">
                                                <div className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-16 h-16 border-2 border-white/30 rounded-full"></div>
                                            </div>

                                            {/* EQUIPO AMARILLO (DERECHA) */}
                                            <div className="relative z-10">
                                                <div className="text-xs font-black text-amber-300 uppercase mb-2 tracking-widest text-center md:text-left">◀ Ataque Equipo Amarillo (1-2-4-1)</div>
                                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
                                                    <div className="bg-slate-900/90 border border-amber-400/50 rounded-lg p-2 shadow-lg">
                                                        <div className="text-[10px] text-slate-400 font-bold">PORTERO</div>
                                                        <div className="text-xs font-extrabold text-amber-200 truncate">{equiposResult.amarillo[0]?.name}</div>
                                                    </div>
                                                    <div className="bg-slate-900/90 border border-amber-400/50 rounded-lg p-2 shadow-lg">
                                                        <div className="text-[10px] text-slate-400 font-bold">DEFENSA</div>
                                                        <div className="text-xs font-extrabold text-amber-200 truncate">{equiposResult.amarillo[1]?.name}</div>
                                                    </div>
                                                    <div className="bg-slate-900/90 border border-amber-400/50 rounded-lg p-2 shadow-lg">
                                                        <div className="text-[10px] text-slate-400 font-bold">DEFENSA</div>
                                                        <div className="text-xs font-extrabold text-amber-200 truncate">{equiposResult.amarillo[2]?.name}</div>
                                                    </div>
                                                    <div className="bg-slate-900/90 border border-amber-400/50 rounded-lg p-2 shadow-lg">
                                                        <div className="text-[10px] text-slate-400 font-bold">MEDIO</div>
                                                        <div className="text-xs font-extrabold text-amber-200 truncate">{equiposResult.amarillo[3]?.name}</div>
                                                    </div>
                                                </div>
                                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-center mt-3">
                                                    <div className="bg-slate-900/90 border border-amber-400/50 rounded-lg p-2 shadow-lg">
                                                        <div className="text-[10px] text-slate-400 font-bold">MEDIO</div>
                                                        <div className="text-xs font-extrabold text-amber-200 truncate">{equiposResult.amarillo[4]?.name}</div>
                                                    </div>
                                                    <div className="bg-slate-900/90 border border-amber-400/50 rounded-lg p-2 shadow-lg">
                                                        <div className="text-[10px] text-slate-400 font-bold">MEDIO</div>
                                                        <div className="text-xs font-extrabold text-amber-200 truncate">{equiposResult.amarillo[5]?.name}</div>
                                                    </div>
                                                    <div className="bg-slate-900/90 border border-amber-400/50 rounded-lg p-2 shadow-lg">
                                                        <div className="text-[10px] text-slate-400 font-bold">MEDIO</div>
                                                        <div className="text-xs font-extrabold text-amber-200 truncate">{equiposResult.amarillo[6]?.name}</div>
                                                    </div>
                                                    <div className="bg-slate-900/90 border border-amber-400/50 rounded-lg p-2 shadow-lg bg-amber-950/80">
                                                        <div className="text-[10px] text-amber-300 font-bold">DELANTERO</div>
                                                        <div className="text-xs font-extrabold text-amber-200 truncate">{equiposResult.amarillo[7]?.name}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
