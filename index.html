<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fut7 Scouting Pro</title>
  <style>
    :root {
      --bg-dark: #080d1a;
      --card-bg: #0f172a;
      --border-color: #1e293b;
      --accent-yellow: #eab308;
      --accent-blue: #38bdf8;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      margin: 0;
      padding: 15px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      color: var(--accent-yellow);
      margin: 0 0 5px 0;
      font-size: 2rem;
      text-transform: uppercase;
    }

    /* Tabs Nav */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .tab-btn.active {
      background: var(--accent-yellow);
      color: #020617;
      border-color: var(--accent-yellow);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: var(--text-light);
    }

    select, textarea, input {
      width: 100%;
      padding: 8px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: white;
      box-sizing: border-box;
    }

    .btn-primary {
      padding: 12px 20px;
      background: var(--accent-yellow);
      color: #020617;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
    }

    .btn-save {
      background: #22c55e;
      color: #020617;
      padding: 10px 20px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    /* Estilos Tabla Interactiva de Valoraciones */
    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th, td {
      padding: 6px;
      text-align: center;
      border: 1px solid var(--border-color);
    }

    th {
      background: #1e293b;
      color: var(--accent-yellow);
    }

    th.judge-header {
      background: #020617;
      color: var(--accent-blue);
    }

    td.player-name {
      text-align: left;
      font-weight: bold;
      white-space: nowrap;
    }

    input.attr-input {
      width: 38px;
      text-align: center;
      padding: 4px;
      font-weight: bold;
    }

    .teams-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    @media (max-width: 768px) {
      .teams-grid { grid-template-columns: 1fr; }
    }

    .team-box {
      background: #111827;
      border-radius: 10px;
      padding: 15px;
      border-top: 4px solid var(--border-color);
    }

    .team-box.negro { border-top-color: var(--accent-blue); }
    .team-box.amarillo { border-top-color: var(--accent-yellow); }

    .player-list-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #1f2937;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Fut7 Scouting Pro</h1>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('generador')">🚀 Generar Equipos</button>
    <button class="tab-btn" onclick="switchTab('plantilla')">📋 Panel de Valoraciones Editable</button>
  </div>

  <!-- PESTAÑA 1: GENERADOR DE EQUIPOS -->
  <div id="tab-generador" class="tab-content active">
    <div class="card">
      <h2>Convocatoria del Día</h2>
      
      <label for="diaPartido">Día del partido:</label>
      <select id="diaPartido" style="margin-bottom:15px;">
        <option value="Lunes">Lunes</option>
        <option value="Miercoles">Miércoles (Priorizar Grupo México)</option>
      </select>

      <label for="listaConvocatoria">Pega la lista de 16 convocados de WhatsApp:</label>
      <textarea id="listaConvocatoria" rows="7" placeholder="1. Reta&#10;2. Agus..."></textarea>

      <button class="btn-primary" style="margin-top:15px;" onclick="generarEquiposWeb()">⚽ Calcular Equipos Equilibrados</button>
    </div>

    <div id="resultadoEquipos"></div>
  </div>

  <!-- PESTAÑA 2: TABLA EDITABLE CON LAS 3 CARACTERÍSTICAS POR JUEZ -->
  <div id="tab-plantilla" class="tab-content">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>Scouting & Valoraciones de Jueces</h2>
        <button class="btn-save" onclick="guardarEnSupabase()">💾 Guardar Cambios en Supabase</button>
      </div>

      <div class="table-wrapper">
        <table id="tablaScouting">
          <thead>
            <tr>
              <th rowspan="2">Jugador</th>
              <th rowspan="2">Pos 1</th>
              <th rowspan="2">Pos 2</th>
              <th colspan="3" class="judge-header">Agus</th>
              <th colspan="3" class="judge-header">Tora</th>
              <th colspan="3" class="judge-header">Lino</th>
              <th colspan="3" class="judge-header">Reta</th>
              <th colspan="3" class="judge-header">Neft</th>
              <th rowspan="2">Media Global</th>
            </tr>
            <tr>
              <!-- Atributos R, V, T por Juez -->
              <th>R</th><th>V</th><th>T</th>
              <th>R</th><th>V</th><th>T</th>
              <th>R</th><th>V</th><th>T</th>
              <th>R</th><th>V</th><th>T</th>
              <th>R</th><th>V</th><th>T</th>
            </tr>
          </thead>
          <tbody id="bodyScouting">
            <tr><td colspan="20">Cargando plantilla de Supabase...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://vwnpmdstzqjdybxvxhvs.supabase.co/rest/v1/jugadores?select=datos&id=eq.1";
  const SUPABASE_UPDATE_URL = "https://vwnpmdstzqjdybxvxhvs.supabase.co/rest/v1/jugadores?id=eq.1";
  const SUPABASE_KEY = "sb_publishable_SVMtK51bFQgPMBrWEJQgBg_vsqvQgHb";
  
  const JUECES = ['Agus', 'Tora', 'Lino', 'Reta', 'Neft'];
  const POSICIONES = ['Portero', 'Defensa', 'Medio', 'Delantero'];
  let jugadoresData = [];

  async function cargarDatosSupabase() {
    try {
      const res = await fetch(SUPABASE_URL, { headers: { 'apikey': SUPABASE_KEY } });
      const data = await res.json();
      if (data && data.length > 0) {
        jugadoresData = data[0].datos;
        renderTablaScouting();
      }
    } catch (err) {
      console.error("Error cargando Supabase:", err);
    }
  }

  function calcularMediaGlobal(p) {
    let sumaTotal = 0, count = 0;
    JUECES.forEach(j => {
      if (p.scores && p.scores[j]) {
        let r = parseFloat(p.scores[j].r) || 0;
        let v = parseFloat(p.scores[j].v) || 0;
        let t = parseFloat(p.scores[j].t) || 0;
        sumaTotal += (r + v + t) / 3;
        count++;
      }
    });
    return count > 0 ? (sumaTotal / count).toFixed(1) : "6.0";
  }

  function renderTablaScouting() {
    const tbody = document.getElementById('bodyScouting');
    tbody.innerHTML = jugadoresData.map((p, idx) => {
      let media = calcularMediaGlobal(p);
      let cellsJueces = JUECES.map(j => {
        let sc = (p.scores && p.scores[j]) ? p.scores[j] : {r:6, v:6, t:6};
        return `
          <td><input class="attr-input" type="number" value="${sc.r}" min="1" max="10" onchange="updateScore(${idx}, '${j}', 'r', this.value)"></td>
          <td><input class="attr-input" type="number" value="${sc.v}" min="1" max="10" onchange="updateScore(${idx}, '${j}', 'v', this.value)"></td>
          <td><input class="attr-input" type="number" value="${sc.t}" min="1" max="10" onchange="updateScore(${idx}, '${j}', 't', this.value)"></td>
        `;
      }).join('');

      return `
        <tr>
          <td class="player-name">${p.name}</td>
          <td>
            <select onchange="updatePos(${idx}, 'pos1', this.value)">
              ${POSICIONES.map(pos => `<option value="${pos}" ${p.pos1 === pos ? 'selected' : ''}>${pos}</option>`).join('')}
            </select>
          </td>
          <td>
            <select onchange="updatePos(${idx}, 'pos2', this.value)">
              ${POSICIONES.map(pos => `<option value="${pos}" ${p.pos2 === pos ? 'selected' : ''}>${pos}</option>`).join('')}
            </select>
          </td>
          ${cellsJueces}
          <td><b id="media-${idx}">${media}</b></td>
        </tr>
      `;
    }).join('');
  }

  function updateScore(pIdx, juez, attr, val) {
    if (!jugadoresData[pIdx].scores) jugadoresData[pIdx].scores = {};
    if (!jugadoresData[pIdx].scores[juez]) jugadoresData[pIdx].scores[juez] = {r:6, v:6, t:6};
    
    jugadoresData[pIdx].scores[juez][attr] = parseFloat(val) || 0;
    document.getElementById(`media-${pIdx}`).innerText = calcularMediaGlobal(jugadoresData[pIdx]);
  }

  function updatePos(pIdx, posKey, val) {
    jugadoresData[pIdx][posKey] = val;
  }

  async function guardarEnSupabase() {
    try {
      const res = await fetch(SUPABASE_UPDATE_URL, {
        method: 'PATCH',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({ datos: jugadoresData })
      });
      if (res.ok) alert("¡Cambios e historial guardados en Supabase!");
      else alert("Error al guardar en Supabase.");
    } catch (err) {
      alert("Error de conexión al guardar.");
    }
  }

  function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
    if (tabName === 'generador') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('tab-generador').classList.add('active');
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('tab-plantilla').classList.add('active');
    }
  }

  function generarEquiposWeb() {
    const texto = document.getElementById('listaConvocatoria').value.toLowerCase();
    const esMiercoles = document.getElementById('diaPartido').value === 'Miercoles';

    if (!texto.trim()) { alert("Pega la lista de convocados."); return; }

    let convocados = jugadoresData.filter(p => {
      let nameClean = p.name.toLowerCase();
      let parts = nameClean.split(' ');
      return parts.some(part => part.length > 2 && texto.includes(part));
    });

    let charly = convocados.find(p => p.name.toLowerCase().includes('charly')) || convocados[0];
    let zlatan = convocados.find(p => p.name.toLowerCase().includes('zlatan'));
    let achraf = convocados.find(p => p.name.toLowerCase().includes('achraf'));

    let resto = convocados.filter(p => p !== charly);
    resto.sort((a, b) => parseFloat(calcularMediaGlobal(b)) - parseFloat(calcularMediaGlobal(a)));

    let amarillo = [charly];
    let negro = [];

    resto.forEach((p) => {
      if (p === zlatan) {
        if (amarillo.includes(achraf)) negro.push(p);
        else amarillo.push(p);
      } else if (p === achraf) {
        if (amarillo.includes(zlatan)) negro.push(p);
        else negro.push(p);
      } else {
        if (amarillo.length < 8 && (negro.length >= amarillo.length || esMiercoles)) {
          amarillo.push(p);
        } else {
          negro.push(p);
        }
      }
    });

    let ptsAmarillo = amarillo.reduce((acc, p) => acc + (parseFloat(calcularMediaGlobal(p)) * 8), 0).toFixed(1);
    let ptsNegro = negro.reduce((acc, p) => acc + (parseFloat(calcularMediaGlobal(p)) * 8), 0).toFixed(1);

    let html = `
      <div class="card">
        <h2>Alineación Generada</h2>
        <div class="teams-grid">
          <div class="team-box negro">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
              <h3>EQUIPO NEGRO</h3>
              <span style="color:var(--accent-blue); font-weight:bold;">PUNTOS: ${ptsNegro}</span>
            </div>
            ${negro.map(p => `<div class="player-list-item"><span><b>${p.name}</b></span><span>${p.pos1}</span></div>`).join('')}
          </div>

          <div class="team-box amarillo">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
              <h3 style="color:var(--accent-yellow);">EQUIPO AMARILLO</h3>
              <span style="color:var(--accent-yellow); font-weight:bold;">PUNTOS: ${ptsAmarillo}</span>
            </div>
            ${amarillo.map(p => `<div class="player-list-item"><span><b>${p.name}</b></span><span>${p.pos1}</span></div>`).join('')}
          </div>
        </div>
      </div>
    `;

    document.getElementById('resultadoEquipos').innerHTML = html;
  }

  window.onload = cargarDatosSupabase;
</script>

</body>
</html>
