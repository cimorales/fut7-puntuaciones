<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fut7 Scouting Pro - Panel React con Supabase</title>
    <!-- Tailwind CSS desde CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM desde CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase JS Client desde CDN -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        const SUPABASE_URL = "https://vwnpmdstzqjdybxvxhvs.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_SVMtK51bFQgPMBrWEJQgBg_vsqvQgHb";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
        }
        .football-pitch {
            background: linear-gradient(135deg, #15803d 0%, #166534 100%);
            position: relative;
            overflow: hidden;
            border: 3px solid white;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
        }
        .pitch-lines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            background-image: 
                linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 10% 10%;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const POSITIONS = ['Medio', 'Defensa', 'Delantero', 'Portero'];

        const JUDGES = [
            { id: 'Agus', name: 'Agus', accent: '#3b82f6' },
            { id: 'Tora', name: 'Tora', accent: '#10b981' },
            { id: 'Lino', name: 'Lino', accent: '#f59e0b' },
            { id: 'Reta', name: 'Reta', accent: '#8b5cf6' },
            { id: 'Neft', name: 'Neft', accent: '#f43f5e' },
        ];

        // Plantilla de respaldo con los nombres limpios oficiales
        const INITIAL_PLAYERS = [
            { id: 1, name: "Charly", pos1: "Medio", pos2: "Delantero", scores: { Agus: {r:7, v:7, t:7}, Tora: {r:6, v:6, t:6}, Lino: {r:7, v:7, t:7}, Reta: {r:7, v:7, t:7}, Neft: {r:7, v:7, t:7} } },
            { id: 2, name: "Zlatan", pos1: "Medio", pos2: "Defensa", scores: { Agus: {r:7, v:7, t:7}, Tora: {r:7, v:7, t:7}, Lino: {r:7, v:7, t:7}, Reta: {r:8, v:8, t:8}, Neft: {r:8, v:8, t:8} } },
            { id: 3, name: "Valencia", pos1: "Defensa", pos2: "Defensa", scores: { Agus: {r:6, v:6, t:6}, Tora: {r:5, v:5, t:5}, Lino: {r:4, v:4, t:4}, Reta: {r:6, v:6, t:6}, Neft: {r:6, v:6, t:6} } },
            { id: 4, name: "Tora", pos1: "Defensa", pos2: "Medio", scores: { Agus: {r:7, v:7, t:7}, Tora: {r:8, v:8, t:8}, Lino: {r:8, v:8, t:8}, Reta: {r:8, v:8, t:8}, Neft: {r:8, v:8, t:8} } },
            { id: 5, name: "Pablo", pos1: "Medio", pos2: "Delantero", scores: { Agus: {r:7, v:7, t:7}, Tora: {r:7, v:7, t:7}, Lino: {r:7, v:7, t:7}, Reta: {r:9, v:9, t:9}, Neft: {r:7, v:7, t:7} } },
            { id: 6, name: "Mon", pos1: "Defensa", pos2: "Defensa", scores: { Agus: {r:6, v:6, t:6}, Tora: {r:6, v:6, t:6}, Lino: {r:6, v:6, t:6}, Reta: {r:7, v:7, t:7}, Neft: {r:6, v:6, t:6} } },
            { id: 7, name: "Carlos", pos1: "Medio", pos2: "Delantero", scores: { Agus: {r:8, v:8, t:8}, Tora: {r:8, v:8, t:8}, Lino: {r:8, v:8, t:8}, Reta: {r:8, v:8, t:8}, Neft: {r:8, v:8, t:8} } },
            { id: 8, name: "Totti", pos1: "Medio", pos2: "Delantero", scores: { Agus: {r:6, v:6, t:6}, Tora: {r:6, v:6, t:6}, Lino: {r:4, v:4, t:4}, Reta: {r:5, v:5, t:5}, Neft: {r:6, v:6, t:6} } },
            { id: 9, name: "Agus", pos1: "Medio", pos2: "Defensa", scores: { Agus: {r:7, v:7, t:7}, Tora: {r:8, v:8, t:8}, Lino: {r:8, v:8, t:8}, Reta: {r:8, v:8, t:8}, Neft: {r:8, v:8, t:8} } },
            { id: 10, name: "Achraf", pos1: "Defensa", pos2: "Medio", scores: { Agus: {r:6, v:6, t:6}, Tora: {r:6, v:6, t:6}, Lino: {r:6, v:6, t:6}, Reta: {r:7, v:7, t:7}, Neft: {r:7, v:7, t:7} } },
            { id: 11, name: "Piñe", pos1: "Defensa", pos2: "Medio", scores: { Agus: {r:8, v:8, t:8}, Tora: {r:9, v:9, t:9}, Lino: {r:9, v:9, t:9}, Reta: {r:9, v:9, t:9}, Neft: {r:8, v:8, t:8} } },
            { id: 12, name: "Reta", pos1: "Medio", pos2: "Defensa", scores: { Agus: {r:8, v:8, t:8}, Tora: {r:9, v:9, t:9}, Lino: {r:8, v:8, t:8}, Reta: {r:8, v:8, t:8}, Neft: {r:8, v:8, t:8} } },
            { id: 13, name: "Luis", pos1: "Defensa", pos2: "Defensa", scores: { Agus: {r:6, v:6, t:6}, Tora: {r:5, v:5, t:5}, Lino: {r:4, v:4, t:4}, Reta: {r:5, v:5, t:5}, Neft: {r:6, v:6, t:6} } },
            { id: 14, name: "Omar", pos1: "Medio", pos2: "Delantero", scores: { Agus: {r:9, v:9, t:9}, Tora: {r:9, v:9, t:9}, Lino: {r:9, v:9, t:9}, Reta: {r:9, v:9, t:9}, Neft: {r:8, v:8, t:8} } },
            { id: 15, name: "Ramón", pos1: "Defensa", pos2: "Medio", scores: { Agus: {r:6, v:6, t:6}, Tora: {r:6, v:6, t:6}, Lino: {r:6, v:6, t:6}, Reta: {r:6, v:6, t:6}, Neft: {r:6, v:6, t:6} } },
            { id: 16, name: "Luis I", pos1: "Medio", pos2: "Defensa", scores: { Agus: {r:6, v:6, t:6}, Tora: {r:7, v:7, t:7}, Lino: {r:7, v:7, t:7}, Reta: {r:7, v:7, t:7}, Neft: {r:6, v:6, t:6} } },
            { id: 17, name: "Jj", pos1: "Delantero", pos2: "Medio", scores: { Agus: {r:7, v:7, t:7}, Tora: {r:7, v:7, t:7}, Lino: {r:8, v:8, t:8}, Reta: {r:7, v:7, t:7}, Neft: {r:7, v:7, t:7} } },
            { id: 18, name: "Nacho", pos1: "Medio", pos2: "Medio", scores: { Agus: {r:9, v:9, t:9}, Tora: {r:9, v:9, t:9}, Lino: {r:9, v:9, t:9}, Reta: {r:8, v:8, t:8}, Neft: {r:9, v:9, t:9} } },
            { id: 19, name: "Miguel", pos1: "Defensa", pos2: "Medio", scores: { Agus: {r:8, v:8, t:8}, Tora: {r:9, v:9, t:9}, Lino: {r:9, v:9, t:9}, Reta: {r:10, v:10, t:10}, Neft: {r:9, v:9, t:9} } },
            { id: 20, name: "Ángel", pos1: "Defensa", pos2: "Defensa", scores: { Agus: {r:3, v:3, t:3}, Tora: {r:3, v:3, t:3}, Lino: {r:3, v:3, t:3}, Reta: {r:4, v:4, t:4}, Neft: {r:5, v:5, t:5} } },
            { id: 21, name: "Alex", pos1: "Medio", pos2: "Delantero", scores: { Agus: {r:7, v:7, t:7}, Tora: {r:7, v:7, t:7}, Lino: {r:7, v:7, t:7}, Reta: {r:7, v:7, t:7}, Neft: {r:7, v:7, t:7} } },
            { id: 22, name: "Sergio A.", pos1: "Medio", pos2: "Defensa", scores: { Agus: {r:7, v:7, t:7}, Tora: {r:7, v:7, t:7}, Lino: {r:7, v:7, t:7}, Reta: {r:8, v:8, t:8}, Neft: {r:7, v:7, t:7} } },
            { id: 23, name: "Javi alto", pos1: "Delantero", pos2: "Medio", scores: { Agus: {r:8, v:8, t:8}, Tora: {r:9, v:9, t:9}, Lino: {r:9, v:9, t:9}, Reta: {r:9, v:9, t:9}, Neft: {r:9, v:9, t:9} } },
            { id: 24, name: "Guille", pos1: "Portero", pos2: "Portero", scores: { Agus: {r:8, v:8, t:8}, Tora: {r:7, v:7, t:7}, Lino: {r:7, v:7, t:7}, Reta: {r:8, v:8, t:8}, Neft: {r:8, v:8, t:8} } },
            { id: 25, name: "Asensio", pos1: "Delantero", pos2: "Delantero", scores: { Agus: {r:7, v:7, t:7}, Tora: {r:6, v:6, t:6}, Lino: {r:6, v:6, t:6}, Reta: {r:7, v:7, t:7}, Neft: {r:6, v:6, t:6} } }
        ];

        // URL pública del JSON (se regenera al cambiar las estadísticas: aviso de Supabase + .github/workflows/exportar-datos.yml)
        const URL_JSON_PUBLICO = "https://raw.githubusercontent.com/cimorales/fut7-puntuaciones/main/datos.json";

        // Copia al portapapeles con alternativa para móviles antiguos
        const copiarTexto = async (txt) => {
            try { await navigator.clipboard.writeText(txt); return true; } catch (e) {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = txt; ta.setAttribute('readonly', '');
                    ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
                    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
                    const ok = document.execCommand('copy'); document.body.removeChild(ta); return ok;
                } catch (e2) { return false; }
            }
        };

        function App() {
            const [activeTab, setActiveTab] = useState('scouting');
            const [players, setPlayers] = useState(INITIAL_PLAYERS);
            const [search, setSearch] = useState('');
            const [activeJudgeMap, setActiveJudgeMap] = useState({});
            const [sortByRank, setSortByRank] = useState(false);
            const [savingStatus, setSavingStatus] = useState('');

            const [statsJson, setStatsJson] = useState('');
            const [statsEstado, setStatsEstado] = useState('');
            const [statsHora, setStatsHora] = useState('');
            const [statsMsg, setStatsMsg] = useState('');

            useEffect(() => {
                async function loadDataFromCloud() {
                    try {
                        const { data } = await supabaseClient.from('jugadores').select('datos').eq('id', 1).single();
                        if (data && data.datos) setPlayers(data.datos);
                    } catch (e) { console.log("Usando plantilla integrada..."); }
                }
                loadDataFromCloud();
            }, []);

            const saveToCloud = async (newPlayersData) => {
                setSavingStatus('Guardando...');
                try {
                    const { error } = await supabaseClient.from('jugadores').upsert({ id: 1, datos: newPlayersData });
                    if (!error) {
                        setSavingStatus('¡Guardado!');
                        setTimeout(() => setSavingStatus(''), 2000);
                    } else { setSavingStatus('Error al guardar'); }
                } catch (e) { setSavingStatus('Error al guardar'); }
            };

            const calcJudgeAvg = (s) => (s ? (s.r + s.v + s.t) / 3 : 6);
            const calcGlobalAvg = (scores) => JUDGES.reduce((acc, j) => acc + calcJudgeAvg(scores[j.id]), 0) / JUDGES.length;

            const toggleJudge = (pId, jId) => {
                setActiveJudgeMap(prev => ({ ...prev, [pId]: prev[pId] === jId ? null : jId }));
            };

            const handleScoreChange = (pId, jId, attr, value) => {
                const val = parseFloat(value) || 0;
                setPlayers(prev => {
                    const updated = prev.map(p => {
                        if (p.id !== pId) return p;
                        return { ...p, scores: { ...p.scores, [jId]: { ...p.scores[jId], [attr]: val } } };
                    });
                    saveToCloud(updated);
                    return updated;
                });
            };

            const handlePosChange = (pId, key, val) => {
                setPlayers(prev => {
                    const updated = prev.map(p => p.id === pId ? { ...p, [key]: val } : p);
                    saveToCloud(updated);
                    return updated;
                });
            };

            const filteredPlayers = useMemo(() => {
                let list = players.filter(p => 
                    p.name.toLowerCase().includes(search.toLowerCase()) ||
                    p.pos1.toLowerCase().includes(search.toLowerCase()) ||
                    p.pos2.toLowerCase().includes(search.toLowerCase())
                );
                if (sortByRank) list.sort((a, b) => calcGlobalAvg(b.scores) - calcGlobalAvg(a.scores));
                return list;
            }, [players, search, sortByRank]);

            // Consulta REST a Supabase (la misma que usa la IA) y muestra el JSON formateado
            const obtenerEstadisticas = async () => {
                setActiveTab('estadisticas');
                setStatsEstado('cargando');
                setStatsMsg('');
                try {
                    const r = await fetch(`${SUPABASE_URL}/rest/v1/jugadores?select=datos&id=eq.1`, {
                        headers: { apikey: SUPABASE_ANON_KEY },
                        cache: 'no-store'
                    });
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    const data = await r.json();
                    setStatsJson(JSON.stringify(data, null, 2));
                    setStatsHora(new Date().toLocaleString('es-ES', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }));
                    setStatsEstado('ok');
                } catch (e) {
                    setStatsEstado('error');
                }
            };

            const copiarEstadisticas = async () => {
                const ok = await copiarTexto(statsJson);
                setStatsMsg(ok ? '✅ Copiado. Pégalo en el chat de la IA.' : 'No se ha podido copiar. Mantén pulsado el texto y cópialo a mano.');
            };

            const nombreArchivo = () => `fut7-estadisticas-${new Date().toISOString().slice(0, 10)}.json`;

            const descargarEstadisticas = () => {
                const blob = new Blob([statsJson], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = nombreArchivo();
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                setStatsMsg('✅ Archivo descargado. Adjúntalo en el chat de la IA.');
            };

            const puedeCompartirArchivo = (() => {
                try {
                    return typeof navigator !== 'undefined' && navigator.canShare &&
                        navigator.canShare({ files: [new File(['{}'], 'x.json', { type: 'application/json' })] });
                } catch (e) { return false; }
            })();

            const compartirArchivo = async () => {
                const file = new File([statsJson], nombreArchivo(), { type: 'application/json' });
                try { await navigator.share({ files: [file], title: 'Estadísticas Fut7' }); }
                catch (e) { if (e && e.name !== 'AbortError') descargarEstadisticas(); }
            };

            const copiarUrl = async () => {
                const ok = await copiarTexto(URL_JSON_PUBLICO);
                setStatsMsg(ok ? '✅ URL copiada.' : 'No se ha podido copiar la URL.');
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-8 font-sans">
                    <div className="max-w-6xl mx-auto">
                        
                        <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 bg-slate-900/80 p-6 rounded-2xl border border-slate-800 shadow-2xl backdrop-blur-xl">
                            <div>
                                <div className="flex items-center gap-3 mb-1">
                                    <div className="p-2.5 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-xl shadow-lg">
                                        <i className="fa-solid fa-trophy text-white text-xl"></i>
                                    </div>
                                    <h1 className="text-2xl font-extrabold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                                        Fut7 Scouting Pro
                                    </h1>
                                </div>
                                <p className="text-xs text-slate-400 font-medium">Panel React sincronizado con Supabase</p>
                            </div>

                            <div className="flex gap-2 bg-slate-950 p-1.5 rounded-xl border border-slate-800 w-full md:w-auto">
                                <button onClick={() => setActiveTab('scouting')} className={`flex-1 md:flex-none px-4 py-2 rounded-lg text-xs font-bold transition-all ${activeTab === 'scouting' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}>
                                    <i className="fa-solid fa-users-viewfinder mr-2"></i>Scouting & Valoraciones
                                </button>
                                <button onClick={obtenerEstadisticas} className={`flex-1 md:flex-none px-4 py-2 rounded-lg text-xs font-bold transition-all ${activeTab === 'estadisticas' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}>
                                    <i className="fa-solid fa-chart-column mr-2"></i>Obtener estadísticas
                                </button>
                            </div>
                        </header>

                        {/* PESTAÑA 1: SCOUTING */}
                        {activeTab === 'scouting' && (
                            <>
                                <div className="flex flex-col md:flex-row justify-between items-center gap-4 mb-4">
                                    <div className="relative w-full md:w-80">
                                        <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                                        <input type="text" placeholder="Buscar jugador..." value={search} onChange={e => setSearch(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-200" />
                                    </div>
                                    <div className="flex items-center gap-3 w-full md:w-auto justify-end">
                                        {savingStatus && <span className="text-xs px-3 py-1.5 rounded-lg bg-blue-500/10 text-blue-400 font-bold">{savingStatus}</span>}
                                        <button onClick={() => setSortByRank(!sortByRank)} className={`px-4 py-2 rounded-xl text-xs font-bold border ${sortByRank ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-900 border-slate-800 text-slate-300'}`}>
                                            <i className="fa-solid fa-sort mr-1"></i>{sortByRank ? 'Ranking Activo' : 'Ordenar por Top'}
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-slate-900/90 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
                                    <div className="grid grid-cols-12 gap-2 p-4 bg-slate-950/80 border-b border-slate-800 text-xs font-bold text-slate-400 uppercase text-center items-center">
                                        <div className="col-span-4 text-left pl-2">Jugador & Demarcaciones</div>
                                        {JUDGES.map(j => (
                                            <div key={j.id} className="col-span-1 flex items-center justify-center gap-1.5">
                                                <span className="w-2 h-2 rounded-full" style={{ backgroundColor: j.accent }}></span><span>{j.name}</span>
                                            </div>
                                        ))}
                                        <div className="col-span-3 text-right pr-2">Media Global</div>
                                    </div>

                                    <div className="divide-y divide-slate-800/60">
                                        {filteredPlayers.map(player => {
                                            const activeJudge = activeJudgeMap[player.id];
                                            const globalAvg = calcGlobalAvg(player.scores).toFixed(1);
                                            return (
                                                <div key={player.id} className="hover:bg-slate-800/30 transition-colors">
                                                    <div className="grid grid-cols-12 gap-2 p-4 items-center text-center">
                                                        <div className="col-span-4 text-left pl-2 flex flex-col gap-1.5">
                                                            <span className="font-bold text-slate-100 text-sm">{player.name}</span>
                                                            <div className="flex gap-2">
                                                                <select value={player.pos1} onChange={e => handlePosChange(player.id, 'pos1', e.target.value)} className="bg-slate-800 text-xs text-slate-300 px-2 py-0.5 rounded-md border border-slate-700">
                                                                    {POSITIONS.map(p => <option key={p} value={p}>{p}</option>)}
                                                                </select>
                                                                <select value={player.pos2} onChange={e => handlePosChange(player.id, 'pos2', e.target.value)} className="bg-slate-800 text-xs text-slate-300 px-2 py-0.5 rounded-md border border-slate-700">
                                                                    {POSITIONS.map(p => <option key={p} value={p}>{p}</option>)}
                                                                </select>
                                                            </div>
                                                        </div>

                                                        {JUDGES.map(j => {
                                                            const avg = calcJudgeAvg(player.scores[j.id]).toFixed(1);
                                                            const isActive = activeJudge === j.id;
                                                            return (
                                                                <div key={j.id} className="col-span-1 flex justify-center">
                                                                    <button onClick={() => toggleJudge(player.id, j.id)} className={`w-11 h-10 rounded-xl font-bold text-sm flex items-center justify-center border transition-all ${isActive ? 'scale-110 border-white/50 ring-2 ring-white/20' : 'border-slate-800 bg-slate-800/40'}`} style={{ color: j.accent, backgroundColor: isActive ? `${j.accent}25` : undefined, borderColor: isActive ? j.accent : undefined }}>
                                                                        {avg}
                                                                    </button>
                                                                </div>
                                                            );
                                                        })}

                                                        <div className="col-span-3 text-right pr-2">
                                                            <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-extrabold text-sm shadow-md">
                                                                <i className="fa-solid fa-fire text-amber-300"></i>{globalAvg}
                                                            </span>
                                                        </div>
                                                    </div>

                                                    {activeJudge && (
                                                        <div className="px-6 py-4 bg-slate-950/70 border-t border-slate-800">
                                                            <div className="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-xl">
                                                                <div className="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
                                                                    <span className="font-bold text-sm text-slate-200">Evaluación: {activeJudge}</span>
                                                                    <button onClick={() => toggleJudge(player.id, activeJudge)} className="text-slate-500 hover:text-slate-300"><i className="fa-solid fa-xmark"></i></button>
                                                                </div>
                                                                <div className="space-y-3">
                                                                    {[{ key: 'r', label: 'Resistencia' }, { key: 'v', label: 'Velocidad' }, { key: 't', label: 'Técnica' }].map(attr => (
                                                                        <div key={attr.key} className="flex items-center justify-between text-xs">
                                                                            <span className="text-slate-400 font-medium w-28">{attr.label}</span>
                                                                            <input type="range" min="0" max="10" step="0.5" value={player.scores[activeJudge][attr.key]} onChange={e => handleScoreChange(player.id, activeJudge, attr.key, e.target.value)} className="w-full mx-3 accent-blue-500 bg-slate-800 h-1.5" />
                                                                            <input type="number" min="0" max="10" step="0.5" value={player.scores[activeJudge][attr.key]} onChange={e => handleScoreChange(player.id, activeJudge, attr.key, e.target.value)} className="w-12 text-center bg-slate-800 border border-slate-700 rounded-md py-1 font-bold text-slate-100" />
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </>
                        )}

                        {/* PESTAÑA 2: ESTADÍSTICAS EN JSON PARA LA IA */}
                        {activeTab === 'estadisticas' && (
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 md:p-6 shadow-2xl">
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                                    <div>
                                        <h2 className="text-lg font-bold text-amber-400 flex items-center gap-2">
                                            <i className="fa-solid fa-chart-column"></i>Estadísticas actualizadas
                                        </h2>
                                        <p className="text-xs text-slate-400 mt-1">
                                            {statsEstado === 'ok' && `Datos obtenidos el ${statsHora}. Cópialos y pégalos en el chat de la IA.`}
                                            {statsEstado === 'cargando' && 'Consultando Supabase…'}
                                            {statsEstado === 'error' && 'No se han podido obtener los datos. Revisa la conexión y vuelve a intentarlo.'}
                                        </p>
                                    </div>
                                    <button onClick={obtenerEstadisticas} className="px-4 py-2 rounded-lg text-xs font-bold bg-slate-800 border border-slate-700 text-slate-200 hover:bg-slate-700">
                                        <i className="fa-solid fa-rotate mr-2"></i>Actualizar
                                    </button>
                                </div>

                                {statsEstado === 'ok' && (
                                    <>
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-3">
                                            <button onClick={copiarEstadisticas} className="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-black rounded-xl shadow-lg hover:from-amber-400 hover:to-amber-500 uppercase tracking-wider text-sm">
                                                📋 Copiar JSON
                                            </button>
                                            <button onClick={descargarEstadisticas} className="w-full py-3.5 bg-slate-800 border border-slate-600 text-slate-100 font-black rounded-xl hover:bg-slate-700 uppercase tracking-wider text-sm">
                                                ⬇️ Descargar .json
                                            </button>
                                            {puedeCompartirArchivo && (
                                                <button onClick={compartirArchivo} className="w-full py-3.5 bg-slate-800 border border-slate-600 text-slate-100 font-black rounded-xl hover:bg-slate-700 uppercase tracking-wider text-sm">
                                                    📤 Enviar archivo a la IA
                                                </button>
                                            )}
                                        </div>
                                        <div className="mb-3 bg-slate-950/60 border border-slate-800 rounded-xl p-3">
                                            <div className="text-xs font-bold text-slate-400 mb-2">URL directa del JSON (se actualiza sola al cambiar las estadísticas):</div>
                                            <div className="flex gap-2">
                                                <input readOnly value={URL_JSON_PUBLICO} onFocus={e => e.target.select()} className="flex-1 min-w-0 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 font-mono" />
                                                <button onClick={copiarUrl} className="px-3 py-2 rounded-lg text-xs font-bold bg-slate-800 border border-slate-700 text-slate-200 hover:bg-slate-700">Copiar</button>
                                            </div>
                                        </div>
                                        {statsMsg && <p className="mb-3 text-sm font-bold text-amber-300">{statsMsg}</p>}
                                        <pre className="max-h-[60vh] overflow-auto bg-slate-950 border border-slate-800 rounded-xl p-3 text-[11px] leading-relaxed text-emerald-300 font-mono whitespace-pre select-all">{statsJson}</pre>
                                    </>
                                )}
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
